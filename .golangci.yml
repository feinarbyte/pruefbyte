version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    gosec:
      excludes:
        - G204 # subprocess with variable args: running git and ocr is the point
        - G304 # reading files from variable paths: config, rule and result files are the point
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
