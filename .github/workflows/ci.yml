name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # keep in sync with mise.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  # Builds every release binary (linux, macOS, windows; amd64, arm64), with ocr
  # embedded, from the same config the release job uses, so a broken release
  # shows up in the PR.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache OCR binaries embedded in release builds
        uses: actions/cache@v6
        with:
          path: internal/ocrbin/bin
          key: ocrbin-${{ hashFiles('internal/ocrbin/VERSION', 'internal/ocrbin/fetch/**') }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: build --snapshot --clean

  # Publishes the binaries for `pruefbyte local` as a GitHub release on v* tags.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs the previous tag
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache OCR binaries embedded in release builds
        uses: actions/cache@v6
        with:
          path: internal/ocrbin/bin
          key: ocrbin-${{ hashFiles('internal/ocrbin/VERSION', 'internal/ocrbin/fetch/**') }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The default comes from the repository's license (MIT) and would replace the
          # Dockerfile's label, but the image also bundles Apache-2.0 licensed ocr.
          labels: |
            org.opencontainers.image.licenses=MIT AND Apache-2.0
          # latest follows main only; the default (auto) would also move it on every v* tag.
          flavor: latest=false
          # Lowest priority, so the version passed to the build is sha-<commit> on main, not "latest".
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}},priority=50
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests only check that the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
